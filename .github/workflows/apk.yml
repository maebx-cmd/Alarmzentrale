name: APK bauen

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: SDK-Lizenzen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bauen
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Alarmzentrale.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alarmzentrale-APK
          path: Alarmzentrale.apk

      - name: Als Release veröffentlichen (Download direkt am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Alarmzentrale APK
          body: "Automatisch gebaut aus ${{ github.sha }}"
          files: Alarmzentrale.apk
          make_latest: true
